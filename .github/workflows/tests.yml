# Unit tests on every platform pip installs on. Scanning itself needs SANE and real hardware, so
# the capture tests that need the kit's runtime skip here.
name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install ruff==0.17.5
      - run: ruff check
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[clean,ui]"
      # The scratch models (about 100 MB), so the scratch-pass tests run too; cached between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/openfilmkit/models
          key: openfilmkit-models-${{ hashFiles('openfilmkit/models.py') }}
      - run: python -m openfilmkit models --fetch
      - run: python -m unittest discover -s tests -v
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python == '3.14') }}
      # On one platform, the same run with a list of the lines no test reaches (not counting those
      # reached only in a separate process, as a job a worker runs is). For reading, not a gate.
      - name: tests, with coverage
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.14' }}
        run: |
          python -m pip install coverage
          python -m coverage run --source=openfilmkit -m unittest discover -s tests -v
          python -m coverage report --show-missing --skip-covered --sort=miss
