[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openfilmkit"
dynamic = ["version"]
description = "Free film scanning and negative conversion from the command line, built on SANE"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Aidan Siegel", email = "openfilmkit@aidansiegel.com" }]
keywords = ["film", "scanner", "sane", "negative", "digitization"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Capture :: Scanners",
]
# Capture needs only the standard library plus OpenFilmKit's SANE runtime (built by
# tools/build_sane.py); conversion needs numpy, Pillow and tifffile (imagecodecs decodes LZW,
# the usual compression in SilverFast and VueScan files); clean also needs OpenCV.
dependencies = ["numpy>=1.24", "pillow>=10", "tifffile>=2024.1.30", "imagecodecs>=2024.1.1"]

[project.optional-dependencies]
# OpenCV 5 moved the Haar cascades (CascadeClassifier) out of the main package.
clean = ["opencv-python-headless>=4.8,<5"]
# The terminal UI (openfilmkit ui). textual-image uses Pillow 12.1's get_flattened_data.
ui = ["textual>=8", "textual-image>=0.14", "pillow>=12.1"]

[project.urls]
Homepage = "https://github.com/aidansiegel/OpenFilmKit"

[project.scripts]
openfilmkit = "openfilmkit.cli:run"

[tool.setuptools.dynamic]
version = { attr = "openfilmkit.__version__" }

[tool.setuptools.packages.find]
include = ["openfilmkit*"]

[tool.setuptools.package-data]
openfilmkit = ["data/*.json", "data/profiles/*.json.gz", "data/face_detection_yunet_2023mar.onnx",
               "data/face_detection_yunet_LICENSE", "scanners/*/*.json"]
