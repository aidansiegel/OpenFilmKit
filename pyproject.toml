[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openfilmkit"
version = "0.0.1"
description = "Free film scanning and negative conversion from the command line (placeholder; early development)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Aidan Siegel", email = "openfilmkit@aidansiegel.com" }]
keywords = ["film", "scanner", "sane", "negative", "digitization"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Capture :: Scanners",
]

[project.urls]
Homepage = "https://github.com/aidansiegel/OpenFilmKit"

[project.scripts]
openfilmkit = "openfilmkit:main"
